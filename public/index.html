<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4f46e5" />
  <title>منصة مستويات الطلاب | تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">🎓</span>
      <div>
        <h1>منصة مستويات الطلاب</h1>
        <p>سجّل دخولك وابدأ من مستواك</p>
      </div>
    </div>

    <form id="login-form" novalidate>
      <label class="field">
        <span>اسم المستخدم</span>
        <input name="username" autocomplete="username" placeholder="مثال: student1" required autofocus />
      </label>

      <label class="field">
        <span>كلمة المرور</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="••••••" required />
      </label>

      <p class="form-error" id="login-error" role="alert"></p>

      <button class="btn btn-primary btn-block" type="submit">دخول</button>
    </form>

    <p class="hint">لو مش عندك حساب، كلّم مسؤول المنصة عشان يعملك يوزر وباسورد.</p>
  </main>

  <script src="/js/cache.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
